    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --primary-glow: #ff4444;
      --secondary-glow: #00f2ff;
      --bg-deep: #03050b;

    body {
      background: var(--bg-deep);

        radial-gradient(ellipse at 20% 50%, rgba(255, 70, 70, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 242, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      height: 100vh;
      width: 100vw;
    }

    /* Animated background particles */
    .bg-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: floatUp linear infinite;
      opacity: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.2; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }

    /* Main floating panel - Premium Glassmorphism */
    .floating-panel {
      position: fixed;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      width: 380px;
      max-height: 90vh;
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border-radius: 32px;
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 25px 60px -20px rgba(0,0,0,0.9),
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 0 80px -30px rgba(255, 70, 70, 0.2);
      z-index: 999;
      cursor: grab;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .floating-panel:active { 
      cursor: grabbing; 
    }
    .floating-panel:hover {
      box-shadow: 
        0 30px 70px -20px rgba(0,0,0,0.95),
        0 0 0 1px rgba(255,255,255,0.08) inset,
        0 0 100px -20px rgba(255, 70, 70, 0.3);

      top: 0;
      left: 20px;
      right: 20px;

      border-radius: 2px;
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }

    .panel-header {
      padding: 20px 22px 14px 22px;

      display: flex;
      justify-content: space-between;
      align-items: center;

<script>
  // ======================= BACKGROUND PARTICLES =======================
  function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 3 + 1;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = Math.random() * 15 + 10 + 's';
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.background = `rgba(255,255,255,${Math.random() * 0.3 + 0.1})`;
      container.appendChild(particle);
    }
  }
  createParticles();

  // ======================= ORIGINAL ENGINE =======================
  class PredictionEngineOriginal {
    constructor() { this.history = []; }
    addNumber(num) { if(num<0||num>9) return false; this.history.unshift(num); if(this.history.length>25) this.history.pop(); return true; }
    detectRepeatingPattern() {
      if(this.history.length<4) return null;
      let bestNext=null, bestConf=0;
      for(let len=2; len<=Math.min(5, Math.floor(this.history.length/2)); len++) {
        let pattern = this.history.slice(0,len);
        let occurrences=[];
        for(let i=0;i<=this.history.length-len;i++) {
          let match=true;
          for(let j=0;j<len;j++) if(this.history[i+j]!==pattern[j]) {match=false;break;}
          if(match) occurrences.push(i);
        }
        if(occurrences.length>=2){
          let nextNums=[];
          for(let pos of occurrences) if(pos+len<this.history.length) nextNums.push(this.history[pos+len]);
          if(nextNums.length){
            let freq={}; for(let n of nextNums) freq[n]=(freq[n]||0)+1;
            let maxCount=0, most=null;
            for(let [num,count] of Object.entries(freq)) if(count>maxCount){maxCount=count; most=parseInt(num);}
            let conf = maxCount/occurrences.length;
            if(conf>bestConf){ bestConf=conf; bestNext=most; }
          }
        }
      }
      if(bestNext!==null) return {next:bestNext, confidence:Math.round(bestConf*100)};
      return null;
    }
    predict() {
      let pat=this.detectRepeatingPattern();
      if(pat && pat.next!==null) {
        let num=pat.next;
        return {predictedNumber:num, type:num>=5?'BIG':'SMALL', confidence:pat.confidence, explanation:`Pattern → ${num}`, needMoreData:false};
      }
      if(this.history.length<2) return {needMoreData:true, explanation:"Insufficient data"};
      let lastNum=this.history[0];
      let followers=[];
      for(let i=0;i<this.history.length-1;i++) if(this.history[i]===lastNum) followers.push(this.history[i+1]);
      if(followers.length){
        let freq={}; for(let f of followers) freq[f]=(freq[f]||0)+1;
        let max=0,most=null; for(let [num,count] of Object.entries(freq)) if(count>max){max=count; most=parseInt(num);}
        if(most!==null) return {predictedNumber:most, type:most>=5?'BIG':'SMALL', confidence:65, explanation:`Freq follow ${most}`, needMoreData:false};
      }
      return {needMoreData:true, explanation:"waiting for pattern"};
    }
  }

  // ======================= V3 OPTIMIZED ENGINE =======================
  class PredictionEngineV3Optimized {
    constructor() {
      this.history = [];
      this.digitHistory = [];
      this.patternWeights = {};
      this.consecutiveWins = 0;
      this.consecutiveLosses = 0;
      this.lastPrediction = null;
      this.isCooldownMode = false;
      this.patternsList = [
        { name: "repeatStreak", fn: this.detectRepeatStreak.bind(this), weight: 1.0 },
        { name: "alternate", fn: this.detectAlternate.bind(this), weight: 0.9 },
        { name: "double", fn: this.detectDouble.bind(this), weight: 0.85 },
        { name: "mixedTriplet", fn: this.detectMixedTriplet.bind(this), weight: 0.8 },
        { name: "sequencePair", fn: this.detectSequencePair.bind(this), weight: 0.85 },
        { name: "longRunBreak", fn: this.detectLongRunBreak.bind(this), weight: 0.7 },
        { name: "breakAfterStreak", fn: this.detectBreakAfterStreak.bind(this), weight: 0.75 },
        { name: "momentumShift", fn: this.detectMomentumShift.bind(this), weight: 0.85 },
        { name: "gapAnalysis", fn: this.detectGapAnalysis.bind(this), weight: 0.7 },
        { name: "trendContinuation", fn: this.detectTrendContinuation.bind(this), weight: 0.9 }
      ];
      this.patternHistory = [];
    }
    getOpposite(res) { return res === "BIG" ? "SMALL" : "BIG"; }
    addNumber(digit, result) {
      if(digit < 0 || digit > 9) return false;
      this.history.unshift({ result, digit, time: Date.now() });
      this.digitHistory.unshift(digit);
      if(this.history.length > 40) this.history.pop();
      if(this.digitHistory.length > 40) this.digitHistory.pop();
      if(this.lastPrediction) {
        let correct = (this.lastPrediction === result);
        if(correct) { this.consecutiveWins++; this.consecutiveLosses = 0; this.isCooldownMode = false; }
        else { this.consecutiveWins = 0; this.consecutiveLosses++; this.isCooldownMode = this.consecutiveLosses >= 2; }
      }
      return true;
    }
    detectRepeatStreak() {
      if(this.history.length < 4) return null;
      let r = this.history.slice(0,4).map(h=>h.result);
      if(r[0]===r[1]&&r[1]===r[2]) return { prediction: r[0]===r[3]?this.getOpposite(r[0]):r[0], confidence: 62 };
      return null;
    }
    detectAlternate() {
      if(this.history.length < 5) return null;
      let r = this.history.slice(0,5).map(h=>h.result);
      if(r.every((v,i,a)=>i===0||v!==a[i-1])) return { prediction: this.getOpposite(r[0]), confidence: 68 };
      return null;
    }
    detectDouble() {
      if(this.history.length < 3) return null;
      let r = this.history.slice(0,3).map(h=>h.result);
      if(r[1]===r[2]&&r[0]!==r[1]) return { prediction: this.getOpposite(r[1]), confidence: 65 };
      return null;
    }
    detectMixedTriplet() {
      if(this.history.length < 4) return null;
      let r = this.history.slice(0,4).map(h=>h.result);
      if(r[0]!==r[1]&&r[1]!==r[2]&&r[0]===r[2]) return { prediction: r[1], confidence: 64 };
      return null;
    }
    detectSequencePair() {
      if(this.history.length < 4) return null;
      let r = this.history.slice(0,4).map(h=>h.result);
      if(r[0]===r[1]&&r[2]===r[3]&&r[0]!==r[2]) return { prediction: r[2], confidence: 67 };
      return null;
    }
    detectLongRunBreak() {
      if(this.history.length < 6) return null;
      let type = this.history[0].result, len = 1;
      for(let i=1;i<this.history.length;i++) { if(this.history[i].result===type) len++; else break; }
      if(len>=5) return { prediction: this.getOpposite(type), confidence: Math.min(58, 50+len) };
      return null;
    }
    detectBreakAfterStreak() {
      if(this.history.length < 4) return null;
      let r = this.history.slice(0,4).map(h=>h.result);
      if(r.every(v=>v===r[0])) return { prediction: this.getOpposite(r[0]), confidence: 60 };
      return null;
    }
    detectMomentumShift() {
      if(this.history.length < 6) return null;
      let big = this.history.slice(0,6).filter(h=>h.result==="BIG").length;
      if(big>=5) return { prediction: "SMALL", confidence: 62 };
      if(big<=1) return { prediction: "BIG", confidence: 62 };
      return null;
    }
    detectGapAnalysis() {
      if(this.history.length < 8) return null;
      let lastBig = this.history.slice(0,10).findIndex(h=>h.result==="BIG");
      let lastSmall = this.history.slice(0,10).findIndex(h=>h.result==="SMALL");
      if(lastBig > lastSmall+3) return { prediction: "BIG", confidence: 58 };
      if(lastSmall > lastBig+3) return { prediction: "SMALL", confidence: 58 };
      return null;
    }
    detectTrendContinuation() {
      if(this.history.length < 4) return null;
      let big = this.history.slice(0,4).filter(h=>h.result==="BIG").length;
      if(big>=3) return { prediction: "BIG", confidence: 60 };
      if(big<=1) return { prediction: "SMALL", confidence: 60 };
      return null;
    }
    calculateWeightedPrediction() {
      let scores = { BIG:0, SMALL:0 }, active=[];
      for(let p of this.patternsList) {
        let res = p.fn();
        if(res && res.prediction) {
          let w = this.patternWeights[p.name] || p.weight;
          scores[res.prediction] += res.confidence * w;
          active.push(res);
        }
      }
      if(active.length===0) return null;
      let total = scores.BIG + scores.SMALL;
      let winner = scores.BIG > scores.SMALL ? "BIG" : "SMALL";
      let conf = Math.round((scores[winner]/total)*100);
      return { prediction: winner, confidence: Math.min(78, conf), pattern: active[0].pattern || "ensemble" };
    }
    predict() {
      if(this.history.length < 4) return { needMoreData: true };
      if(this.isCooldownMode && this.history.length) {
        return { type: this.history[0].result, confidence: 48, explanation: "COOLDOWN", modeUsed: "COOLDOWN" };
      }
      let w = this.calculateWeightedPrediction();
      if(w) {
        this.lastPrediction = w.prediction;
        return { type: w.prediction, confidence: w.confidence, explanation: w.pattern, modeUsed: "V3" };
      }
      let last = this.history[0].result;
      return { type: last, confidence: 52, explanation: "fallback", modeUsed: "V3" };
    }
    getCooldownStatus() { return this.isCooldownMode; }
  }

  // ======================= NEURAL ENGINE =======================
  class NeuralEngine {
    constructor() {
      this.strategies = [
        { id: 'ma', fn: (list) => (list.slice(0,5).reduce((a,b)=>a+b.number,0)/5) > 4.5 ? 'SMALL' : 'BIG' },
        { id: 'wma', fn: (list) => ((list[0].number*3 + list[1].number*2 + list[2].number*1)/6) > 4.5 ? 'SMALL' : 'BIG' },
        { id: 'rev', fn: (list) => list.slice(0,3).filter(x=>x.number>=5).length >= 2 ? 'SMALL' : 'BIG' },
        { id: 'mom', fn: (list) => list[0].number > list[1].number ? 'BIG' : 'SMALL' }
      ];
    }
    predict(drawList) {
      if(!drawList || drawList.length < 6) return null;
      const votes = { BIG: 0, SMALL: 0 };
      this.strategies.forEach(s => votes[s.fn(drawList)]++);
      const final = votes.BIG >= votes.SMALL ? 'BIG' : 'SMALL';
      const confidence = Math.round((Math.max(votes.BIG, votes.SMALL) / 4) * 100);
      return { type: final, confidence: confidence, explanation: `Neural (${votes.BIG}B/${votes.SMALL}S)` };
    }
  }

  // ======================= MAIN APP =======================
  const REQUIRED_PASSWORD = "20262026";
  let systemLocked = false;
  let lastIssueId = "", lastMadePrediction = null, currentStreak = 0;
  let originalEngine, v3OptimizedEngine, neuralEngine;
  let activeFormulaMode = "HYBRID";
  let widget, historyDiv, predictionSpan, formulaMsgSpan, streakSpan, timerSpan;
  let formulaSwitchBtn, currentFormulaLabelSpan, confidenceFill, coolModeIndicator;
  let showBtn, hideBtn;
  let lastDrawCache = null;
  let structuredLogEntries = [];

  async function fetchDrawDataDirect() {
    const targetUrl = "https://draw.ar-lottery01.com/TrxWinGo/TrxWinGo_1M/GetHistoryIssuePage.json";
    const proxyList = [ "https://api.allorigins.win/get?url=", "https://corsproxy.io/?", "https://api.codetabs.com/v1/proxy?quest=" ];
    for (let i = 0; i < proxyList.length; i++) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        const proxyUrl = proxyList[i] + encodeURIComponent(targetUrl);
        const response = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!response.ok) continue;
        const jsonData = await response.json();
        let parsed = (i === 0 && jsonData.contents) ? JSON.parse(jsonData.contents) : jsonData;
        if (parsed?.data?.list?.length > 0) {
          lastDrawCache = parsed.data.list;
          return parsed.data.list;
        }
      } catch(e) { continue; }
    }
    return lastDrawCache?.length ? lastDrawCache : generateMockDrawData();
  }

  function generateMockDrawData() {
    const mock = [];
    const now = new Date();
    for (let i = 0; i < 25; i++) {
      const num = Math.floor(Math.random() * 10);
      mock.push({ issueNumber: "TRX"+Date.now()+i, number: num.toString(), openTime: new Date(now - i*60000).toISOString() });
    }
    return mock;
  }

  function addHistoryLog(issueShort, actual, predicted, isCorrect, timestamp) {
    if(!historyDiv) return;
    if(historyDiv.children.length===1 && historyDiv.children[0].innerText.includes("AWAITING")) historyDiv.innerHTML="";
    const entry = document.createElement("div");
    entry.className = "history-entry";
    const timeStr = timestamp || new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const resultClass = actual==="BIG" ? "pill-big" : "pill-small";
    const predClass = predicted==="BIG" ? "pill-big" : (predicted==="SMALL"?"pill-small":"pill-wait");
    entry.innerHTML = `<span class="time-col">${timeStr}</span><span class="issue-col">${issueShort}</span><span class="result-pill ${resultClass}">${actual}</span><span style="color:#64748b;">→</span><span class="result-pill ${predClass}">${predicted||"?"}</span><span class="${isCorrect?'match-yes':'match-no'}" style="font-weight:700;">${isCorrect?'✓':'✗'}</span>`;
    historyDiv.prepend(entry);
    while(historyDiv.children.length > 50) historyDiv.removeChild(historyDiv.lastChild);
    structuredLogEntries.unshift({ timeStr, issueShort, actual, predicted: predicted||"?", correct: isCorrect?'✓':'✗' });
    if(structuredLogEntries.length > 100) structuredLogEntries.pop();
  }

  function copyLast20Logs() {
    const recent = structuredLogEntries.slice(0,20);
    if(!recent.length) { alert("No data"); return; }
    let text = "TIME\tISSUE\tRESULT\tPREDICTION\tSTATUS\n" + recent.map(e=>`${e.timeStr}\t${e.issueShort}\t${e.actual}\t${e.predicted}\t${e.correct}`).join("\n");
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.getElementById("copyLast20Btn");
      if(btn) { const t=btn.innerText; btn.innerText="✅ COPIED!"; setTimeout(()=>btn.innerText=t,1200); }
    });
  }

  function copyAllLogs() {
    if(!structuredLogEntries.length) { alert("No data"); return; }
    const wins = structuredLogEntries.filter(e=>e.correct==='✓').length;
    let text = "TIME\tISSUE\tRESULT\tPREDICTION\tSTATUS\n" + structuredLogEntries.map(e=>`${e.timeStr}\t${e.issueShort}\t${e.actual}\t${e.predicted}\t${e.correct}`).join("\n");
    text += `\n\n========== SUMMARY ==========\nTOTAL: ${structuredLogEntries.length}\nWINS: ${wins}\nRATE: ${((wins/structuredLogEntries.length)*100).toFixed(1)}%\n=============================`;
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.getElementById("copyAllLogsBtn");
      if(btn) { const t=btn.innerText; btn.innerText="✅ ALL COPIED!"; setTimeout(()=>btn.innerText=t,1200); }
    });
  }

  function getHybridPrediction(drawList) {
    const v3Result = v3OptimizedEngine.predict();
    const neuralResult = neuralEngine.predict(drawList);
    
    let v3Type = v3Result?.type || null;
    let v3Conf = v3Result?.confidence || 0;
    let neuralType = neuralResult?.type || null;
    let neuralConf = neuralResult?.confidence || 0;
    
    if (v3Type && neuralType && v3Type === neuralType) {
      return {
        type: v3Type,
        confidence: Math.round((v3Conf * 0.55 + neuralConf * 0.45)),
        explanation: `HYBRID agree: ${v3Type}`,
        modeUsed: "HYBRID-CONSENSUS"
      };
    }
    
    if (v3Type && !neuralType) return { ...v3Result, modeUsed: "V3-FALLBACK" };
    if (!v3Type && neuralType) return { ...neuralResult, modeUsed: "NEURAL-FALLBACK" };
    
    if (v3Type && neuralType && v3Type !== neuralType) {
      const v3Weighted = v3Conf * 0.6;
      const neuralWeighted = neuralConf * 0.4;
      if (v3Weighted >= neuralWeighted) {
        return { type: v3Type, confidence: Math.round(v3Weighted), explanation: "HYBRID (V3)", modeUsed: "HYBRID-V3" };
      } else {
        return { type: neuralType, confidence: Math.round(neuralWeighted), explanation: "HYBRID (Neural)", modeUsed: "HYBRID-NEURAL" };
      }
    }
    
    return v3Result || neuralResult || { type: "BIG", confidence: 50, explanation: "default" };
  }

  function updatePredictionUI(engineResult, drawList = null) {
    if (!predictionSpan) return;
    
    if (!engineResult || engineResult.needMoreData || !engineResult.type) {
      predictionSpan.innerText = "⏳";
      predictionSpan.className = "wait-glow text-center";
      formulaMsgSpan.innerHTML = "✨ Building patterns...";
      if(confidenceFill) confidenceFill.style.width = "0%";
      return;
    }

    const pred = engineResult.type;
    predictionSpan.innerText = pred;
    
    if (engineResult.modeUsed?.includes("COOLDOWN")) {
      predictionSpan.className = "cool-glow text-center";
    } else if (pred === "BIG") {
      predictionSpan.className = "big-glow text-center";
    } else {
      predictionSpan.className = "small-glow text-center";
    }

    const conf = engineResult.confidence || 65;
    if(confidenceFill) confidenceFill.style.width = conf + "%";
    
    const modeTag = engineResult.modeUsed || "V3";
    formulaMsgSpan.innerHTML = `🧠 ${modeTag} | ${pred} | ${engineResult.explanation?.substring(0,35) || "active"}`;
    
    if(coolModeIndicator) {
      coolModeIndicator.style.display = v3OptimizedEngine?.getCooldownStatus() ? "block" : "none";
    }
    
    lastMadePrediction = pred;
    if(streakSpan) streakSpan.innerText = currentStreak;
  }

  async function fetchAndProcess() {
    if(systemLocked) return;
    try {
      const drawList = await fetchDrawDataDirect();
      if (!drawList || drawList.length === 0) return;

      const latestIssue = drawList[0].issueNumber;
      const latestNum = parseInt(drawList[0].number) || 5;
      const currentResult = latestNum >= 5 ? "BIG" : "SMALL";

      if (latestIssue !== lastIssueId) {
        if (lastIssueId !== "") {
          originalEngine.addNumber(latestNum);
          v3OptimizedEngine.addNumber(latestNum, currentResult);
          
          const isMatch = (lastMadePrediction === currentResult);
          currentStreak = isMatch ? currentStreak + 1 : 0;
          if(streakSpan) streakSpan.innerText = currentStreak;
          
          addHistoryLog(latestIssue.slice(-6), currentResult, lastMadePrediction || "?", isMatch, new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}));
        } else {
          for (let i = Math.min(18, drawList.length)-1; i >= 0; i--) {
            const num = parseInt(drawList[i].number);
            if (!isNaN(num)) {
              originalEngine.addNumber(num);
              v3OptimizedEngine.addNumber(num, num >= 5 ? "BIG" : "SMALL");
            }
          }
        }
        lastIssueId = latestIssue;
      }

      let finalResult;
      if (activeFormulaMode === "ORIGINAL") {
        finalResult = originalEngine.predict();
      } else if (activeFormulaMode === "V3OPT") {
        finalResult = v3OptimizedEngine.predict();
      } else {
        finalResult = getHybridPrediction(drawList);
      }
      
      updatePredictionUI(finalResult, drawList);

    } catch (e) {
      console.warn("Fetch error", e);
    }
  }

  function toggleFormulaMode() {
    const modes = ["HYBRID", "V3OPT", "ORIGINAL"];
    const currentIdx = modes.indexOf(activeFormulaMode);
    activeFormulaMode = modes[(currentIdx + 1) % modes.length];
    
    if (activeFormulaMode === "HYBRID") {
      formulaSwitchBtn.classList.add("active");
      currentFormulaLabelSpan.innerText = "HYBRID V3";
    } else if (activeFormulaMode === "V3OPT") {
      formulaSwitchBtn.classList.add("active");
      currentFormulaLabelSpan.innerText = "V3 OPTIMIZED";
    } else {
      formulaSwitchBtn.classList.remove("active");
      currentFormulaLabelSpan.innerText = "ORIGINAL";
    }
    formulaMsgSpan.innerHTML = `🔄 Switched to ${activeFormulaMode}`;
    fetchAndProcess();
  }

  function enableDraggable() {
    const panel = document.getElementById("floatingWidget");
    const header = document.getElementById("dragHandle");
    if(!panel||!header) return;
    let isDragging = false, offsetX, offsetY;
    header.addEventListener("mousedown", (e) => {
      if(e.target.closest('button')) return;
      isDragging = true;
      const rect = panel.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      panel.style.transition = 'none';
      e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => {
      if(!isDragging) return;
      const newLeft = Math.min(Math.max(0, e.clientX - offsetX), window.innerWidth - panel.offsetWidth);
      const newTop = Math.min(Math.max(0, e.clientY - offsetY), window.innerHeight - panel.offsetHeight);
      panel.style.left = newLeft + "px";
      panel.style.top = newTop + "px";
      panel.style.transform = 'none';
    });
    window.addEventListener("mouseup", () => { 
      isDragging = false; 
      panel.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
    });
  }

  function authSystem() {
    const inputKey = document.getElementById("secretKey").value.trim();
    if (inputKey !== REQUIRED_PASSWORD) { alert("⛔ ACCESS DENIED"); return; }

    document.getElementById("loginOverlay").style.display = "none";
    widget = document.getElementById("floatingWidget"); widget.style.display = "block";
    showBtn = document.getElementById("showPanelFloatBtn");
    predictionSpan = document.getElementById("predictionValue");
    formulaMsgSpan = document.getElementById("formulaMessage");
    streakSpan = document.getElementById("streakNumber");
    historyDiv = document.getElementById("historyLogContainer");
    timerSpan = document.getElementById("sessionTimer");
    hideBtn = document.getElementById("hidePanelBtn");
    formulaSwitchBtn = document.getElementById("formulaSwitch");
    currentFormulaLabelSpan = document.getElementById("currentFormulaLabel");
    confidenceFill = document.getElementById("confidenceFill");
    coolModeIndicator = document.getElementById("coolModeIndicator");

    if(hideBtn) hideBtn.addEventListener("click", ()=>{ widget.style.display="none"; if(showBtn) showBtn.style.display="flex"; });
    if(showBtn) showBtn.addEventListener("click", ()=>{ widget.style.display="block"; showBtn.style.display="none"; });

    document.getElementById("copyLast20Btn").addEventListener("click", copyLast20Logs);
    document.getElementById("copyAllLogsBtn").addEventListener("click", copyAllLogs);

    originalEngine = new PredictionEngineOriginal();
    v3OptimizedEngine = new PredictionEngineV3Optimized();
    neuralEngine = new NeuralEngine();
    activeFormulaMode = "HYBRID";
    formulaSwitchBtn.classList.add("active");
    currentFormulaLabelSpan.innerText = "HYBRID V3";
    formulaSwitchBtn.addEventListener("click", toggleFormulaMode);

    if(timerSpan) timerSpan.innerText = "LIVE";
    fetchAndProcess();
    setInterval(fetchAndProcess, 3400);
    enableDraggable();
  }

  window.onload = () => {};
</script>
